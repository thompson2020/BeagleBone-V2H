alias: Publish SmartExport → Zappi & Eddi Control
description: Stop Zappi and Eddi when exporting; restore Zappi to Eco+ when done.
triggers:
  - trigger: state
    entity_id: sensor.smart_export_status
    for:
      seconds: 2
conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state.state not in ['unavailable', 'unknown', 'none'] }}
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sensor.smart_export_status
            state: "1"
        sequence:
          - action: script.zappi_set_stop
          - action: script.eddi_boost_cancel
      - conditions:
          - condition: state
            entity_id: sensor.smart_export_status
            state: "0"
        sequence:
          - action: script.zappi_set_ecoplus
mode: single
