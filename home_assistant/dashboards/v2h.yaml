# V2H Dashboard
# ─────────────────────────────────────────────────────────────────────────────
# Paste this into HA → Settings → Dashboards → (your dashboard) → Edit → Raw
# configuration editor, replacing the entire file content.
#
# Required HACS cards:
#   - mushroom          https://github.com/piitaya/lovelace-mushroom
#   - button-card       https://github.com/custom-cards/button-card
#   - mini-graph-card   https://github.com/kalkih/mini-graph-card
#
# Entity IDs are set by MQTT Discovery from the discovery topic object_id.
# They appear after the first connect as sensor.indra_* / binary_sensor.indra_*
# ─────────────────────────────────────────────────────────────────────────────

title: V2H
views:
  - title: V2H Charger
    path: v2h
    icon: mdi:car-electric
    cards:

      # ═══════════════════════════════════════════════════════════════════════
      # PANEL 1 — STATUS
      # ═══════════════════════════════════════════════════════════════════════

      # Mode + active supervisory badge
      - type: custom:mushroom-template-card
        primary: >
          {% set mode = states('sensor.indra_operation_mode') %}
          {% if   mode == 'V2h'       %}V2H Active
          {% elif mode == 'Charge'    %}Charging
          {% elif mode == 'Discharge' %}Discharging
          {% elif mode == 'Idle'      %}Idle
          {% else                     %}{{ mode }}
          {% endif %}
        secondary: >
          {% set a = states('sensor.indra_current_amps') | float(0) %}
          {% if   a >  0 %}Charging {{ a | round(1) }} A
          {% elif a <  0 %}Discharging {{ (a | abs) | round(1) }} A
          {% else        %}Standby
          {% endif %}
        icon: >
          {% set mode = states('sensor.indra_operation_mode') %}
          {% if   mode == 'V2h'       %}mdi:home-battery
          {% elif mode == 'Charge'    %}mdi:battery-charging-100
          {% elif mode == 'Discharge' %}mdi:battery-arrow-up
          {% else                     %}mdi:battery-off-outline
          {% endif %}
        icon_color: >
          {% set mode = states('sensor.indra_operation_mode') %}
          {% if   mode == 'V2h'       %}green
          {% elif mode == 'Charge'    %}blue
          {% elif mode == 'Discharge' %}orange
          {% else                     %}grey
          {% endif %}
        badge_icon: >
          {% if   is_state('binary_sensor.indra_ready_to_drive_active',  'on') %}mdi:car-clock
          {% elif is_state('binary_sensor.indra_off_peak_charging_active','on') %}mdi:clock-time-two
          {% elif is_state('binary_sensor.indra_smart_charge_active',    'on') %}mdi:lightning-bolt
          {% elif is_state('binary_sensor.indra_smart_export_active',    'on') %}mdi:transmission-tower-export
          {% elif is_state('binary_sensor.indra_smart_export_excess_solar_active','on') %}mdi:solar-power
          {% else %}{% endif %}
        badge_color: >
          {% if   is_state('binary_sensor.indra_ready_to_drive_active',  'on') %}teal
          {% elif is_state('binary_sensor.indra_off_peak_charging_active','on') %}purple
          {% elif is_state('binary_sensor.indra_smart_charge_active',    'on') %}blue
          {% elif is_state('binary_sensor.indra_smart_export_active',    'on') %}orange
          {% elif is_state('binary_sensor.indra_smart_export_excess_solar_active','on') %}yellow
          {% else %}grey
          {% endif %}
        tap_action:
          action: none

      # SoC gauge
      - type: gauge
        entity: sensor.indra_soc
        name: Battery SoC
        unit: "%"
        min: 0
        max: 100
        needle: true
        segments:
          - from: 0
            color: "#ef4444"
          - from: 20
            color: "#f59e0b"
          - from: 50
            color: "#22c55e"

      # Current + DC volts + PRE temp
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% set a = states('sensor.indra_current_amps') | float(0) %}
              {{ a | round(1) }} A
            secondary: >
              {% set a = states('sensor.indra_current_amps') | float(0) %}
              {% if a > 0 %}Charging{% elif a < 0 %}Discharging{% else %}Idle{% endif %}
            icon: mdi:current-dc
            icon_color: >
              {% set a = states('sensor.indra_current_amps') | float(0) %}
              {{ 'blue' if a > 0 else ('orange' if a < 0 else 'grey') }}
            tap_action:
              action: none
          - type: custom:mushroom-entity-card
            entity: sensor.indra_dc_output_volts
            name: DC Volts
            icon: mdi:flash
          - type: custom:mushroom-entity-card
            entity: sensor.indra_pre_temp
            name: PRE Temp
            icon: mdi:thermometer

      # Grid + charger power
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.indra_meter_total_w
            name: Grid Power
            icon: mdi:transmission-tower
          - type: custom:mushroom-entity-card
            entity: sensor.indra_meter_charger_w
            name: Charger Power
            icon: mdi:ev-plug-chademo

      # ═══════════════════════════════════════════════════════════════════════
      # PANEL 2 — MODE CONTROL
      # ═══════════════════════════════════════════════════════════════════════

      - type: horizontal-stack
        cards:

          - type: custom:button-card
            name: Idle
            icon: mdi:pause-circle-outline
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra/command
                payload: '{"cmd": {"SetMode": "Idle"}}'
            styles:
              card:
                - background-color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Idle'
                        ? 'rgba(148,163,184,0.25)' : 'var(--card-background-color)' ]]]
                - border: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Idle'
                        ? '2px solid #94a3b8' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Idle'
                        ? '#94a3b8' : 'var(--secondary-text-color)' ]]]
              name:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Idle'
                        ? '#94a3b8' : 'var(--secondary-text-color)' ]]]

          - type: custom:button-card
            name: V2H
            icon: mdi:home-battery
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra/command
                payload: '{"cmd": {"SetMode": "V2h"}}'
            styles:
              card:
                - background-color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'V2h'
                        ? 'rgba(74,222,128,0.2)' : 'var(--card-background-color)' ]]]
                - border: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'V2h'
                        ? '2px solid #4ade80' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'V2h'
                        ? '#4ade80' : 'var(--secondary-text-color)' ]]]
              name:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'V2h'
                        ? '#4ade80' : 'var(--secondary-text-color)' ]]]

          - type: custom:button-card
            name: Charge
            icon: mdi:battery-charging-100
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra/command
                payload: '{"cmd": {"SetMode": "Charge"}}'
            styles:
              card:
                - background-color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Charge'
                        ? 'rgba(96,165,250,0.2)' : 'var(--card-background-color)' ]]]
                - border: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Charge'
                        ? '2px solid #60a5fa' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Charge'
                        ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
              name:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Charge'
                        ? '#60a5fa' : 'var(--secondary-text-color)' ]]]

          - type: custom:button-card
            name: Discharge
            icon: mdi:battery-arrow-up
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra/command
                payload: '{"cmd": {"SetMode": "Discharge"}}'
            styles:
              card:
                - background-color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Discharge'
                        ? 'rgba(251,146,60,0.2)' : 'var(--card-background-color)' ]]]
                - border: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Discharge'
                        ? '2px solid #fb923c' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Discharge'
                        ? '#fb923c' : 'var(--secondary-text-color)' ]]]
              name:
                - color: >
                    [[[ return states['sensor.indra_operation_mode'].state === 'Discharge'
                        ? '#fb923c' : 'var(--secondary-text-color)' ]]]

      # ═══════════════════════════════════════════════════════════════════════
      # PANEL 3 — SUPERVISORY STATE CHIPS
      # ═══════════════════════════════════════════════════════════════════════

      - type: custom:mushroom-chips-card
        chips:
          - type: template
            content: Smart Charge
            icon: mdi:lightning-bolt
            icon_color: >
              {{ 'blue' if is_state('binary_sensor.indra_smart_charge_active', 'on') else 'grey' }}
            tap_action:
              action: none

          - type: template
            content: Smart Export
            icon: mdi:transmission-tower-export
            icon_color: >
              {{ 'orange' if is_state('binary_sensor.indra_smart_export_active', 'on') else 'grey' }}
            tap_action:
              action: none

          - type: template
            content: Solar Export
            icon: mdi:solar-power
            icon_color: >
              {{ 'yellow' if is_state('binary_sensor.indra_smart_export_excess_solar_active', 'on') else 'grey' }}
            tap_action:
              action: none

          - type: template
            content: Drain Protect
            icon: mdi:shield-battery-outline
            icon_color: >
              {{ 'red' if is_state('binary_sensor.indra_ev_drain_protection_active', 'on') else 'grey' }}
            tap_action:
              action: none

          - type: template
            content: Off-Peak
            icon: mdi:clock-time-two-outline
            icon_color: >
              {{ 'purple' if is_state('binary_sensor.indra_off_peak_charging_active', 'on') else 'grey' }}
            tap_action:
              action: none

          - type: template
            content: Ready to Drive
            icon: mdi:car-clock
            icon_color: >
              {{ 'teal' if is_state('binary_sensor.indra_ready_to_drive_active', 'on') else 'grey' }}
            tap_action:
              action: none

      # ═══════════════════════════════════════════════════════════════════════
      # POWER HISTORY GRAPHS
      # ═══════════════════════════════════════════════════════════════════════

      - type: custom:mini-graph-card
        name: V2H Current
        entities:
          - entity: sensor.indra_current_amps
            name: Current (A)
            color: "#4ade80"
        hours_to_show: 2
        points_per_hour: 60
        line_width: 2
        show:
          labels: true
          points: false
          legend: false
          fill: true
        lower_bound: ~-17
        upper_bound: ~17

      - type: custom:mini-graph-card
        name: Power Flow
        entities:
          - entity: sensor.indra_meter_total_w
            name: Grid (W)
            color: "#60a5fa"
          - entity: sensor.indra_meter_charger_w
            name: Charger (W)
            color: "#f59e0b"
        hours_to_show: 2
        points_per_hour: 60
        line_width: 2
        show:
          labels: true
          points: false
          legend: true
