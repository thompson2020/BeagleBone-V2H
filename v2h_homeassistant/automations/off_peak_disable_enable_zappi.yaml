alias: Off-Peak Charging — Disable/Enable Zappi
description: >
  Disables Zappi at 23:10 and re-enables it at 05:50. Gated by
  input_boolean.off_peak_zappi_control.

  Previously used a normally-distributed random delay (~20 min after 22:50 for off,
  ~25 min after 04:50 for on) to disguise the EV as a dumb charger to Octopus.
  Removed as fixed times are simpler and more predictable.
  To reinstate: change triggers back to 22:50/04:50, set mode to parallel, and
  restore the delay+re-check blocks from git history before each script call.
triggers:
  - trigger: time
    at: "23:10:00"
    id: zappi_off
  - trigger: time
    at: "05:50:00"
    id: zappi_on
conditions:
  - condition: state
    entity_id: input_boolean.off_peak_zappi_control
    state: "on"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: zappi_off
        sequence:
          - action: script.zappi_set_stop
      - conditions:
          - condition: trigger
            id: zappi_on
        sequence:
          - action: script.zappi_set_ecoplus
mode: single
