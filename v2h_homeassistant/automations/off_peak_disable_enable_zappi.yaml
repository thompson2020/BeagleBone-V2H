alias: Off-Peak Charging — Disable/Enable Zappi
description: >
  Disables Zappi before 23:30 and re-enables it after 05:30. Gated by
  input_boolean.off_peak_zappi_control.

  Uses a normally-distributed random delay (sum of two uniform samples, CLT
  approximation) to disguise the EV as a dumb charger to Octopus:
    - Off: trigger 23:00, mean ~10 min delay → average action ~23:10 ± 10 min
    - On:  trigger 05:40, mean ~10 min delay → average action ~05:50 ± 10 min

  After each delay a re-check confirms the gate switch is still on before
  calling the script, preventing stale triggers from acting if the switch was
  turned off during the delay window. Mode is parallel so both branches can
  run independently without blocking each other.

triggers:
  - trigger: time
    at: "23:00:00"
    id: zappi_off
  - trigger: time
    at: "05:40:00"
    id: zappi_on
conditions:
  - condition: state
    entity_id: input_boolean.off_peak_zappi_control
    state: "on"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: zappi_off
        sequence:
          - delay:
              seconds: >
                {{ (range(0, 600)|random + range(0, 600)|random) | int }}
          - condition: state
            entity_id: input_boolean.off_peak_zappi_control
            state: "on"
          - action: script.zappi_set_stop
          - action: logbook.log
            data:
              name: Zappi — Off-Peak
              message: Zappi stopped for off-peak V2H window
      - conditions:
          - condition: trigger
            id: zappi_on
        sequence:
          - delay:
              seconds: >
                {{ (range(0, 600)|random + range(0, 600)|random) | int }}
          - condition: state
            entity_id: input_boolean.off_peak_zappi_control
            state: "on"
          - action: script.zappi_set_ecoplus
          - action: logbook.log
            data:
              name: Zappi — Off-Peak
              message: Zappi re-enabled (eco+) after off-peak V2H window
mode: parallel
