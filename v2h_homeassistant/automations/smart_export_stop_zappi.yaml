alias: Publish SmartExport → Zappi Control (Eddi handled separately)
description: >-
  Stop Zappi when exporting; restore Zappi to Eco+ when done.
  Eddi is handled separately by smart_charge_start_eddi (which has an off-peak guard).
triggers:
  - trigger: state
    entity_id: sensor.smart_export_status
    for:
      seconds: 2
conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state.state not in ['unavailable', 'unknown', 'none'] }}
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sensor.smart_export_status
            state: "1"
        sequence:
          - action: script.zappi_set_stop
      - conditions:
          - condition: state
            entity_id: sensor.smart_export_status
            state: "0"
        sequence:
          - action: script.zappi_set_ecoplus
mode: single
