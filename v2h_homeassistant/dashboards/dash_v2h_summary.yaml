            max: 6000
            needle: true
            needle_color: '#000000'
            segments:
              - from: -6000
                color: var(--blue-color)
              - from: -250
                color: var(--green-color)
              - from: 250
                color: var(--red-color)
              - from: 6000
                color: var(--red-color)
            gradient: false
            gradient_background: false
            gradient_resolution: auto
            inner:
              min: -6000
              max: 6000
              mode: on_main
              needle_color: var(--green-color)
              segments:
                - from: -6000
                  color: var(--blue-color)
                - from: -250
                  color: var(--green-color)
                - from: 250
                  color: var(--red-color)
                - from: 6000
                  color: var(--red-color)
              gradient: false
              gradient_background: false
              gradient_resolution: auto
              round: 'off'
            marker: false
            round: 'off'
            titles:
