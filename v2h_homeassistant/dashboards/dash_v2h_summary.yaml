                    to: 70
                    color: var(--red-color)
                  - from: 70
                    to: 90
                    color: var(--orange-color)
                  - from: 90
                    to: 100
                    color: var(--green-color)
            direction: right
            height: 28px
            animation:
              state: 'off'
            positions:
              icon: 'off'
              indicator: inside
              name: outside
              value: inside
            rounded: true
            card_mod:
              style: |
                ha-card {
                  border-radius: 18px;
                  padding: 12px;
                }
            grid_options:
              columns: 6
              rows: auto
          - type: custom:bar-card
            title: null
            entities:
              - entity: sensor.v2h_pre_temperature
