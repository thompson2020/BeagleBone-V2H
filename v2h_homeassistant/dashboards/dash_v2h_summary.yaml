title: V2H
views:
  - type: sections
    title: V2H Charger
    path: v2h-simple
    icon: mdi:car-electric
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% set mode = states('sensor.v2h_operation_mode') %} {% if   mode
              == 'V2h'       %}V2H Active {% elif mode == 'Charge'    %}Charging
              {% elif mode == 'Discharge' %}Discharging {% elif mode ==
              'Idle'      %}Idle {% else                     %}{{ mode }} {%
              endif %}
            secondary: >
              {% set a = states('sensor.v2h_dc_output_amps') | float(0) %} {%
              if   a <  0 %}Discharging {{ (a | abs) | round(1) }} A {% elif a
              >  0 %}Charging {{ a | round(1) }} A {% else        %}Standby {%
              endif %}
            icon: >
              {% set mode = states('sensor.v2h_operation_mode') %} {% if   mode
              == 'V2h'       %}mdi:home-battery {% elif mode == 'Charge'   
              %}mdi:battery-charging-100 {% elif mode == 'Discharge'
              %}mdi:battery-arrow-up {% else                    
              %}mdi:battery-off-outline {% endif %}
            icon_color: >
              {% set mode = states('sensor.v2h_operation_mode') %} {% if   mode
              == 'V2h'       %}green {% elif mode == 'Charge'    %}blue {% elif
              mode == 'Discharge' %}orange {% else                     %}grey {%
              endif %}
            badge_icon: >
              {% if   is_state('binary_sensor.v2h_ready_to_drive_active',  
              'on') %}mdi:car-clock {% elif
              is_state('binary_sensor.v2h_off_peak_charging_active','on')
              %}mdi:clock-time-two {% elif
              is_state('binary_sensor.v2h_smart_charge_active',     'on')
              %}mdi:lightning-bolt {% elif
              is_state('binary_sensor.v2h_smart_export_active',     'on')
              %}mdi:transmission-tower-export {% elif
              is_state('binary_sensor.v2h_smart_export_solar_active','on')
              %}mdi:solar-power {% else %}{% endif %}
            badge_color: >
              {% if   is_state('binary_sensor.v2h_ready_to_drive_active',  
              'on') %}teal {% elif
              is_state('binary_sensor.v2h_off_peak_charging_active','on')
              %}purple {% elif
              is_state('binary_sensor.v2h_smart_charge_active',     'on') %}blue
              {% elif is_state('binary_sensor.v2h_smart_export_active',    
              'on') %}orange {% elif
              is_state('binary_sensor.v2h_smart_export_solar_active','on')
              %}yellow {% else %}grey {% endif %}
            tap_action:
              action: none
            grid_options:
              rows: auto
              columns: 12
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Idle
                icon: mdi:pause-circle-outline
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  service_data:
                    topic: v2h/command
                    payload: '{"cmd":{"SetMode":"Idle"}}'
                styles:
                  card:
                    - background-color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Idle'
                            ? 'rgba(148,163,184,0.25)' : 'var(--card-background-color)' ]]]
                    - border: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Idle'
                            ? '2px solid #94a3b8' : '1px solid var(--divider-color)' ]]]
                  icon:
                    - color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Idle'
                            ? '#94a3b8' : 'var(--secondary-text-color)' ]]]
                  name:
                    - color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Idle'
                            ? '#94a3b8' : 'var(--secondary-text-color)' ]]]
              - type: custom:button-card
                name: V2H
                icon: mdi:home-battery
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  service_data:
                    topic: v2h/command
                    payload: '{"cmd":{"SetMode":"V2h"}}'
                styles:
                  card:
                    - background-color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'V2h'
                            ? 'rgba(74,222,128,0.2)' : 'var(--card-background-color)' ]]]
                    - border: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'V2h'
                            ? '2px solid #4ade80' : '1px solid var(--divider-color)' ]]]
                  icon:
                    - color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'V2h'
                            ? '#4ade80' : 'var(--secondary-text-color)' ]]]
                  name:
                    - color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'V2h'
                            ? '#4ade80' : 'var(--secondary-text-color)' ]]]
              - type: custom:button-card
                name: Boost
                icon: mdi:battery-charging-100
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  service_data:
                    topic: v2h/command
                    payload: '{"cmd":{"SetMode":"Charge"}}'
                styles:
                  card:
                    - background-color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Charge'
                            ? 'rgba(96,165,250,0.2)' : 'var(--card-background-color)' ]]]
                    - border: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Charge'
                            ? '2px solid #60a5fa' : '1px solid var(--divider-color)' ]]]
                  icon:
                    - color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Charge'
                            ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
                  name:
                    - color: >
                        [[[ return states['sensor.v2h_operation_mode'].state ===
                        'Charge'
                            ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
          - type: custom:gauge-card-pro
            entity: sensor.v2h_soc
            min: 0
            max: 100
            needle: true
            card_mod:
              style: |
                ha-card {
                  position: relative;
                }

                /* Top-left title */
                ha-card::before {
                  content: "SoC";
                  position: absolute;
                  top: 8px;
                  left: 10px;
                  font-size: 13px;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }

                /* Top-right small metrics */
                ha-card::after {
                  content: "{{ states('sensor.v2h_pre_temperature') | float | round(1) }}°C  |  {{ states('sensor.v2h_pre_fan_duty') | float | round(0) }}%";
                  position: absolute;
                  top: 8px;
                  right: 10px;
                  font-size: 11px;
                  color: var(--secondary-text-color);
                }
            segments:
              - from: 0
                color: '#ef4444'
              - from: 20
                color: '#f59e0b'
              - from: 80
                color: '#22c55e'
            inner:
              mode: 'off'
            titles:
              primary:
                value: ''
            value_texts:
              primary:
                value: '{{ states(''sensor.v2h_soc'') | float | round(0) }}'
                unit_of_measurement: '%'
            grid_options:
              columns: 12
          - type: custom:gauge-card-pro
            entity: sensor.v2h_grid_power
            entity2: sensor.v2h_grid_phase_power
            min: -6000
            max: 6000
            needle: true
            card_mod:
              style: |

                ha-card {
                  position: relative;
                }

                ha-card::before {
                  content: "Exporting";
                  position: absolute;
                  left: 8px;
                  bottom: 28px;
                  font-size: 12px;
                  color: var(--blue-color);
                }

                ha-card::after {
                  content: "Importing";
                  position: absolute;
                  right: 8px;
                  bottom: 28px;
                  font-size: 12px;
                  color: var(--red-color);
                }


                ha-card::marker {
                }
                ha-card > div::before {
                  content: "Grid W";
                  position: absolute;
                  top: 8px;
                  left: 10px;
                  font-size: 13px;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
                 
            segments:
              - from: -6000
                color: var(--blue-color)
              - from: -250
                color: var(--green-color)
              - from: 250
                color: var(--red-color)
              - from: 6000
                color: var(--red-color)
            inner:
              mode: on_main
              needle_color: var(--black-color)
            titles:
              primary:
                value: null
            value_texts:
              primary:
                value: '{{ states(''sensor.v2h_grid_power'') | float | round(0) }}'
                unit_of_measurement: W
              secondary:
                value: '{{ states(''sensor.v2h_grid_phase_power'') | float | round(0) }}'
                color: var(--info-color)
                unit_of_measurement: W(Phase)
            grid_options:
              columns: 12
              rows: auto
          - type: custom:gauge-card-pro
            entity: sensor.v2h_ac_power
            entity2: sensor.v2h_dc_power
            min: -6000
            max: 6000
            needle: true
            card_mod:
              style: |
                ha-card {
                  position: relative;
                }

                ha-card::before {
                  content: "Discharging";
                  position: absolute;
                  left: 8px;
                  bottom: 28px;
                  font-size: 12px;
                  color: var(--red-color);
                }

                ha-card::after {
                  content: "Charging";
                  position: absolute;
                  right: 8px;
                  bottom: 28px;
                  font-size: 12px;
                  color: var(--green-color);
                }

                ha-card::marker {
                }
                ha-card > div::before {
                  content: "Battery";
                  position: absolute;
                  top: 0px;
                  left: 0px;
                  font-size: 13px;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            segments:
              - from: -6000
                color: var(--red-color)
              - from: 0
                color: var(--red-color)
              - from: 0
                color: var(--green-color)
              - from: 6000
                color: var(--green-color)
            inner:
              mode: on_main
              needle_color: var(--black-color)
            titles:
              primary:
                value: null
            value_texts:
              primary:
                value: '{{ states(''sensor.v2h_ac_power'') | float | round(0) }}'
                unit_of_measurement: W AC
              secondary:
                value: '{{ states(''sensor.v2h_dc_power'') | float | round(0) }}'
                color: var(--info-color)
                unit_of_measurement: W DC
            grid_options:
              columns: 12
              rows: auto
          - type: gauge
            unit: '%'
            min: 0
            max: 100
            needle: true
            card_mod:
              style: |
                ha-card {
                  position: relative;
                }

                ha-card::before {
                  content: "Eff";
                  position: absolute;
                  top: 8px;
                  left: 10px;
                  font-size: 13px;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            segments:
              - from: 0
                color: '#ef4444'
              - from: 70
                color: '#f59e0b'
              - from: 90
                color: '#22c55e'
            entity: sensor.v2h_efficiency
            grid_options:
              columns: 6
              rows: 1.5
            name: ''
      - type: grid
        cards:
          - type: custom:expander-card
            title: V2H Settings
            expanded: false
            padding: 4
            clear: true
            cards:
