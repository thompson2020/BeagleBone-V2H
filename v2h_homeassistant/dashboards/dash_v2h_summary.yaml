                color: var(--black-color)
                unit_of_measurement: W
                unit_before_value: false
              secondary:
                value: '{{ states(''sensor.v2h_dc_power'') | float | round(0) }}'
                color: var(--black-color)
                unit_of_measurement: W (DC)
                unit_before_value: false
            min_indicator:
              type: entity
              value: sensor.v2h_dc_power
              color: '#aaa'
              label: true
              label_color: var(--black-color)
              precision: 0
            max_indicator:
              type: entity
              value: sensor.v2h_ac_power
              color: '#aaa'
              label: true
              label_color: var(--black-color)
              precision: 0
            setpoint:
              type: entity
              value: sensor.v2h_efficiency
              color: '#aaa'
              label: true
              label_color: var(--black-color)
              precision: 0
            tap_action:
              action: more-info
              entity: sensor.v2h_ac_power
            hold_action:
              action: more-info
            double_tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  position: relative;
                }

                ha-card::before {
                  content: "Exporting";
                  position: absolute;
                  left: 8px;
                  bottom: 28px;
                  font-size: 12px;
                  color: var(--blue-color);
                }

                ha-card::after {
                  content: "Importing";
                  position: absolute;
                  right: 8px;
                  bottom: 28px;
                  font-size: 12px;
                  color: var(--red-color);
                }

                ha-card > div::before {
                  content: "V2H Power";
                  position: absolute;
                  top: 8px;
                  left: 10px;
                  font-size: 13px;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }

                * {
                  --main-needle-stroke-width: 1px;
                  --main-needle-stroke-color: white;
                }
            grid_options:
              columns: 12
              rows: auto
      - cards:
          - type: heading
            heading: History
