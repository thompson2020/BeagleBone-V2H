                  name:
                    - color: |
                        [[[ return entity.state === 'on'
                            ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
                    - font-size: 0.7em
              - type: custom:button-card
                tap_action:
                  action: none
                styles:
                  card:
                    - background-color: transparent
                    - border: none
                    - box-shadow: none
              - type: custom:button-card
                tap_action:
                  action: none
                styles:
                  card:
                    - background-color: transparent
                    - border: none
                    - box-shadow: none
            grid_options:
