views:
  - title: Home
    sections:
      - type: grid
        cards:
          - type: custom:power-flow-card-plus
            entities:
              battery:
                entity: sensor.sdm230indra_sdm230indra_power
                state_of_charge: sensor.v2h_soc
                state_of_charge_unit: '%'
                invert_state: true
                display_zero_tolerance: 10
                min: 0
                max: 100
              grid:
                entity: sensor.smart_meter_electricity_power
                display_zero_tolerance: 50
              home:
                secondary_info: {}
                subtract_individual: true
              individual:
                - entity: sensor.myenergi_zappi_22323585_power_ct_internal_load
                  secondary_info: {}
                  name: EV
                  icon: mdi:car-electric
                  color_value: false
                  display_zero: true
                  display_zero_state: false
                - entity: sensor.myenergi_eddi_24456595_internal_load_ct1
                  secondary_info: {}
                  name: Water
                  icon: mdi:water-boiler-auto
                  color_value: false
                  display_zero: true
                  display_zero_state: false
              solar:
                secondary_info: {}
                entity: sensor.sdm120solar_sdm120solar_power_inverted
            clickable_entities: true
            display_zero_lines:
              mode: transparency
              transparency: 90
              grey_color:
                - 189
                - 189
                - 189
            use_new_flow_rate_model: true
            w_decimals: 0
            kw_decimals: 3
            min_flow_rate: 0.75
            max_flow_rate: 6
            max_expected_power: 2000
            min_expected_power: 0.01
            watt_threshold: 1000
            transparency_zero_lines: 60
            sort_individual_devices: false
            disable_dots: false
            display_zero_tolerance: 50
          - type: entities
            title: Override - Grid (Import Total)
            show_header_toggle: false
            entities:
              - entity: input_boolean.smart_meter_electricity_power_override
