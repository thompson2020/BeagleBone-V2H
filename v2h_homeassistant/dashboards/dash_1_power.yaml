            height: 420
            unit_prefix: ''
            round: 1
            convert_units_to: ''
            co2_intensity_entity: sensor.co2_signal_co2_intensity
            min_box_size: 3
            min_box_distance: 5
            min_state: 0
            show_states: true
            show_units: false
            sections:
              - entities:
