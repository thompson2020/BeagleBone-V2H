type: grid
cards:
  - type: heading
    heading: Time/Event Based
    heading_style: title
  - type: vertical-stack
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: Ready to Drive
            icon: mdi:steering
            tap_action:
              action: none
            styles:
              card:
                - background-color: var(--card-background-color)
                - border: 1px solid var(--divider-color)
              icon:
                - color: var(--secondary-text-color)
              name:
                - color: var(--secondary-text-color)
                - font-size: 0.7em
          - type: custom:button-card
            entity: binary_sensor.v2h_ready_to_drive_enabled
            name: Enabled
            icon: mdi:shield-check-outline
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: v2h/command
                payload: |
                  [[[
                    return entity.state === 'on'
                      ? '{"cmd":{"SetSetting":{"ready_to_drive":false}}}'
                      : '{"cmd":{"SetSetting":{"ready_to_drive":true}}}';
                  ]]]
            styles:
              card:
                - background-color: |
                    [[[ return entity.state === 'on'
                        ? 'rgba(96,165,250,0.2)' : 'var(--card-background-color)' ]]]
                - border: |
                    [[[ return entity.state === 'on'
                        ? '2px solid #60a5fa' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: |
                    [[[ return entity.state === 'on'
                        ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
              name:
                - color: |
                    [[[ return entity.state === 'on'
                        ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
          - type: custom:button-card
            entity: binary_sensor.v2h_ready_to_drive_request
            name: Request
            icon: mdi:circle-outline
            tap_action:
              action: none
            styles:
              card:
                - background-color: |
                    [[[ return entity.state === 'on'
                        ? 'rgba(74,222,128,0.15)' : 'var(--card-background-color)' ]]]
                - border: |
                    [[[ return entity.state === 'on'
                        ? '2px solid #4ade80' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: |
                    [[[ return entity.state === 'on'
                        ? '#4ade80' : 'var(--secondary-text-color)' ]]]
              name:
                - color: |
                    [[[ return entity.state === 'on'
                        ? '#4ade80' : 'var(--secondary-text-color)' ]]]
          - type: custom:button-card
            entity: binary_sensor.v2h_ready_to_drive_active
            name: Active
            icon: mdi:circle
            tap_action:
              action: none
            styles:
              card:
                - background-color: |
                    [[[ return entity.state === 'on'
                        ? 'rgba(239,68,68,0.2)' : 'var(--card-background-color)' ]]]
                - border: |
                    [[[ return entity.state === 'on'
                        ? '2px solid #ef4444' : '1px solid var(--divider-color)' ]]]
              icon:
                - color: |
                    [[[ return entity.state === 'on'
                        ? '#ef4444' : 'var(--secondary-text-color)' ]]]
              name:
                - color: |
                    [[[ return entity.state === 'on'
                        ? '#ef4444' : 'var(--secondary-text-color)' ]]]
      - type: custom:expander-card
        title: Configure
        expanded: false
        padding: 8
        cards:
          - type: entities
            entities:
              - entity: input_number.v2h_ready_to_drive_soc
                name: SoC Target
              - entity: input_datetime.v2h_ready_to_drive_start_time
                name: Start Time
              - entity: input_datetime.v2h_ready_to_drive_end_time
                name: End Time
    grid_options:
      columns: 12
      rows: auto
