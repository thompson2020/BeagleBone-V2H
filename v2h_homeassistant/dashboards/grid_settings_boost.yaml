type: grid
cards:
  - type: custom:expander-card
    title: Boost Settings
    expanded: false
    padding: 4
    clear: true
    cards:
      - type: entities
        entities:
          - entity: number.v2h_charge_soc_limit
            name: SoC Limit
          - entity: number.v2h_charge_amps
            name: Amps
    grid_options:
      columns: 12
      rows: auto
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: switch.v2h_charge_eco
        name: Eco Mode
        icon: mdi:leaf
        tap_action:
          action: toggle
        styles:
          card:
            - background-color: |
                [[[ return entity.state === 'on'
                    ? 'rgba(96,165,250,0.2)' : 'var(--card-background-color)' ]]]
            - border: |
                [[[ return entity.state === 'on'
                    ? '2px solid #60a5fa' : '1px solid var(--divider-color)' ]]]
            - height: 48px
          icon:
            - color: |
                [[[ return entity.state === 'on'
                    ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
          name:
            - color: |
                [[[ return entity.state === 'on'
                    ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
            - font-size: 0.7em
      - type: custom:button-card
        tap_action:
          action: none
        styles:
          card:
            - background-color: transparent
            - border: none
            - box-shadow: none
      - type: custom:button-card
        tap_action:
          action: none
        styles:
          card:
            - background-color: transparent
            - border: none
            - box-shadow: none
    grid_options:
      columns: 12
      rows: auto
