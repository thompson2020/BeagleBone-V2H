          - type: custom:button-card
            entity: binary_sensor.beaglebone_v2h_off_peak_charging_request
            name: Off-Peak
            icon: mdi:clock-time-two-outline
            show_state: false
            tap_action:
              action: none
            custom_fields:
              indicators: >
                [[[
                  const req = entity.state === 'on';
                  const act = states['binary_sensor.beaglebone_v2h_off_peak_charging_active'];
                  const active = act && act.state === 'on';
                  return `<div style="display:flex;gap:10px;justify-content:center;font-size:0.68em;padding-bottom:6px">
                    <span style="color:${req?'#60a5fa':'#6b7280'}">⬤ Req</span>
                    <span style="color:${active?'#a78bfa':'#6b7280'}">⬤ Act</span>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_off_peak_charging_active'];
                      if (act && act.state === 'on') return 'rgba(167,139,250,0.2)';
                      if (entity.state === 'on') return 'rgba(96,165,250,0.12)';
                      return 'var(--card-background-color)';
                    ]]]
                - border: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_off_peak_charging_active'];
                      if (act && act.state === 'on') return '2px solid #a78bfa';
                      if (entity.state === 'on') return '2px solid #60a5fa';
                      return '1px solid var(--divider-color)';
                    ]]]
              icon:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_off_peak_charging_active'];
                      if (act && act.state === 'on') return '#a78bfa';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_off_peak_charging_active'];
                      if (act && act.state === 'on') return '#a78bfa';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--primary-text-color)';
                    ]]]
              custom_fields:
                indicators:
                  - padding: "0"
            grid_options:
              columns: 3

      # ═══════════════════════════════════════════════════════════════════════
      # GRAPHS
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        columns: 2
        cards:
          - type: heading
            heading: Power History
          - type: custom:mini-graph-card
            name: Power Flow
            entities:
              - entity: sensor.beaglebone_v2h_grid_power
                name: Grid (W)
                color: '#60a5fa'
              - entity: sensor.beaglebone_v2h_ac_power
                name: Charger (W)
                color: '#f59e0b'
            hours_to_show: 2
            points_per_hour: 60
            line_width: 2
            show:
              labels: true
              points: false
              legend: true
            grid_options:
              columns: 12
          - type: custom:mini-graph-card
            name: DC Output
            entities:
              - entity: sensor.beaglebone_v2h_dc_output_amps
                name: Amps (A)
                color: '#4ade80'
            hours_to_show: 2
            points_per_hour: 60
            line_width: 2
            show:
              labels: true
              points: false
              legend: false
              fill: true
            lower_bound: ~-17
            upper_bound: ~17
            grid_options:
              columns: 12
