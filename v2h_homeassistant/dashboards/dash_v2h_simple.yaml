# V2H Simple Dashboard — sections/grid layout
# ─────────────────────────────────────────────────────────────────────────────
# Paste into HA → Settings → Dashboards → (your dashboard) → Edit → Raw config
#
# HACS cards required:
#   - mushroom        https://github.com/piitaya/lovelace-mushroom
#   - button-card     https://github.com/custom-cards/button-card
#   - mini-graph-card https://github.com/kalkih/mini-graph-card
#   - bar-card        https://github.com/custom-cards/bar-card
#
# Entity IDs set by MQTT Discovery (beaglebone_v2h_ prefix).
# Supervisory tap = toggle request ON/OFF via MQTT publish.
# ─────────────────────────────────────────────────────────────────────────────

title: V2H Simple
views:
  - type: sections
    title: V2H Charger
    path: v2h-simple
    icon: mdi:car-electric
    sections:

      # ═══════════════════════════════════════════════════════════════════════
      # LEFT — VISUAL STATUS
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% set mode = states('sensor.beaglebone_v2h_operation_mode') %} {%
              if   mode == 'V2h'       %}V2H Active {% elif mode == 'Charge'
              %}Charging {% elif mode == 'Discharge' %}Discharging {% elif mode
              == 'Idle'      %}Idle {% else                     %}{{ mode }} {%
              endif %}
            secondary: >
              {% set a = states('sensor.beaglebone_v2h_dc_output_amps') |
              float(0) %} {% if   a <  0 %}Discharging {{ (a | abs) | round(1)
              }} A {% elif a >  0 %}Charging {{ a | round(1) }} A {% else
              %}Standby {% endif %}
            icon: >
              {% set mode = states('sensor.beaglebone_v2h_operation_mode') %} {%
              if   mode == 'V2h'       %}mdi:home-battery {% elif mode ==
              'Charge'    %}mdi:battery-charging-100 {% elif mode == 'Discharge'
              %}mdi:battery-arrow-up {% else
              %}mdi:battery-off-outline {% endif %}
            icon_color: >
              {% set mode = states('sensor.beaglebone_v2h_operation_mode') %} {%
              if   mode == 'V2h'       %}green {% elif mode == 'Charge'
              %}blue {% elif mode == 'Discharge' %}orange {%
              else                     %}grey {% endif %}
            badge_icon: >
              {% if
              is_state('binary_sensor.beaglebone_v2h_ready_to_drive_active',
              'on') %}mdi:car-clock {% elif
              is_state('binary_sensor.beaglebone_v2h_off_peak_charging_active','on')
              %}mdi:clock-time-two {% elif
              is_state('binary_sensor.beaglebone_v2h_smart_charge_active',
              'on') %}mdi:lightning-bolt {% elif
              is_state('binary_sensor.beaglebone_v2h_smart_export_active',
              'on') %}mdi:transmission-tower-export {% elif
              is_state('binary_sensor.beaglebone_v2h_smart_export_solar_active','on')
              %}mdi:solar-power {% else %}{% endif %}
            badge_color: >
              {% if
              is_state('binary_sensor.beaglebone_v2h_ready_to_drive_active',
              'on') %}teal {% elif
              is_state('binary_sensor.beaglebone_v2h_off_peak_charging_active','on')
              %}purple {% elif
              is_state('binary_sensor.beaglebone_v2h_smart_charge_active',
              'on') %}blue {% elif
              is_state('binary_sensor.beaglebone_v2h_smart_export_active',
              'on') %}orange {% elif
              is_state('binary_sensor.beaglebone_v2h_smart_export_solar_active','on')
              %}yellow {% else %}grey {% endif %}
            tap_action:
              action: none
            grid_options:
              rows: auto
              columns: 12
          - type: custom:mushroom-template-card
            primary: >
              {% set mode = states('sensor.beaglebone_v2h_operation_mode') %} {%
              if   mode == 'V2h'       %}V2H Active {% elif mode == 'Charge'
              %}Charging {% elif mode == 'Discharge' %}Discharging {% elif mode
              == 'Idle'      %}Idle {% else %}{{ mode }}{% endif %}
            secondary: >
              {% set s = states('sensor.beaglebone_v2h_active_mode') %} {% if s
              and s != 'Normal' %}{{ s }}{% else %}—{% endif %}
            icon: >
              {% set mode = states('sensor.beaglebone_v2h_operation_mode') %} {%
              if   mode == 'V2h'       %}mdi:home-battery {% elif mode ==
              'Charge'    %}mdi:battery-charging-100 {% elif mode == 'Discharge'
              %}mdi:battery-arrow-up {% else %}mdi:car-electric{% endif %}
            icon_color: >
              {% set mode = states('sensor.beaglebone_v2h_operation_mode') %} {%
              if   mode == 'V2h'       %}green {% elif mode == 'Charge'
              %}blue {% elif mode == 'Discharge' %}orange {% else %}grey{% endif
              %}
            layout: vertical
            tap_action:
              action: none
            grid_options:
              columns: 12
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Idle
                icon: mdi:pause-circle-outline
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  service_data:
                    topic: v2h/command
                    payload: '{"cmd":{"SetMode":"Idle"}}'
                styles:
                  card:
                    - background-color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Idle'
                            ? 'rgba(148,163,184,0.25)' : 'var(--card-background-color)' ]]]
                    - border: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Idle'
                            ? '2px solid #94a3b8' : '1px solid var(--divider-color)' ]]]
                  icon:
                    - color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Idle'
                            ? '#94a3b8' : 'var(--secondary-text-color)' ]]]
                  name:
                    - color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Idle'
                            ? '#94a3b8' : 'var(--secondary-text-color)' ]]]
              - type: custom:button-card
                name: V2H
                icon: mdi:home-battery
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  service_data:
                    topic: v2h/command
                    payload: '{"cmd":{"SetMode":"V2h"}}'
                styles:
                  card:
                    - background-color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'V2h'
                            ? 'rgba(74,222,128,0.2)' : 'var(--card-background-color)' ]]]
                    - border: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'V2h'
                            ? '2px solid #4ade80' : '1px solid var(--divider-color)' ]]]
                  icon:
                    - color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'V2h'
                            ? '#4ade80' : 'var(--secondary-text-color)' ]]]
                  name:
                    - color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'V2h'
                            ? '#4ade80' : 'var(--secondary-text-color)' ]]]
              - type: custom:button-card
                name: Charge
                icon: mdi:battery-charging-100
                tap_action:
                  action: call-service
                  service: mqtt.publish
                  service_data:
                    topic: v2h/command
                    payload: '{"cmd":{"SetMode":"Charge"}}'
                styles:
                  card:
                    - background-color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Charge'
                            ? 'rgba(96,165,250,0.2)' : 'var(--card-background-color)' ]]]
                    - border: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Charge'
                            ? '2px solid #60a5fa' : '1px solid var(--divider-color)' ]]]
                  icon:
                    - color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Charge'
                            ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
                  name:
                    - color: >
                        [[[ return
                        states['sensor.beaglebone_v2h_operation_mode'].state ===
                        'Charge'
                            ? '#60a5fa' : 'var(--secondary-text-color)' ]]]
          - type: gauge
            entity: sensor.beaglebone_v2h_soc
            name: Battery SoC
            unit: '%'
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: '#ef4444'
              - from: 20
                color: '#f59e0b'
              - from: 50
                color: '#22c55e'
          - type: tile
            entity: sensor.beaglebone_v2h_pre_temperature
            name: PRE Temperature
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.beaglebone_v2h_pre_fan_duty
            name: Fan Duty
            grid_options:
              columns: 6
          - type: custom:bar-card
            direction: up
            columns: 4
            height: 120
            entities:
              - entity: sensor.beaglebone_v2h_dc_power
                name: Batt DC
                min: -7000
                max: 7000
                color: '#4ade80'
              - entity: sensor.beaglebone_v2h_ac_power
                name: AC
                min: 0
                max: 7000
                color: '#60a5fa'
              - entity: sensor.beaglebone_v2h_grid_power
                name: Grid
                min: -7000
                max: 7000
                color: '#f59e0b'
              - entity: sensor.beaglebone_v2h_grid_phase_power
                name: Phase
                min: -7000
                max: 7000
                color: '#a78bfa'
            positions:
              icon: 'off'
              indicator: 'off'
              name: inside
              value: below
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.beaglebone_v2h_efficiency
            name: Efficiency
            grid_options:
              columns: 6
              rows: 1

      # ═══════════════════════════════════════════════════════════════════════
      # SUPERVISORY CONTROLS
      # Tap  = toggle request ON / OFF via MQTT
      # ⬤ Req / ⬤ Act indicators show live state
      # Ready to Drive and Off-Peak are set by the scheduler — display only
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        cards:
          - type: heading
            heading: Supervisory Controls

          # ── Row 1: two prominent modes (columns 6 each) ──────────────────

          - type: custom:button-card
            entity: binary_sensor.beaglebone_v2h_smart_charge_request
            name: Self Use
            icon: mdi:home-battery
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra_from_ha/smart_charge/request
                payload: "[[[ return entity.state === 'on' ? '0' : '1'; ]]]"
            custom_fields:
              indicators: >
                [[[
                  const req = entity.state === 'on';
                  const act = states['binary_sensor.beaglebone_v2h_smart_charge_active'];
                  const active = act && act.state === 'on';
                  return `<div style="display:flex;gap:14px;justify-content:center;font-size:0.72em;padding-bottom:6px">
                    <span style="color:${req?'#60a5fa':'#6b7280'}">⬤ Req</span>
                    <span style="color:${active?'#4ade80':'#6b7280'}">⬤ Active</span>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_charge_active'];
                      if (act && act.state === 'on') return 'rgba(74,222,128,0.2)';
                      if (entity.state === 'on') return 'rgba(96,165,250,0.12)';
                      return 'var(--card-background-color)';
                    ]]]
                - border: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_charge_active'];
                      if (act && act.state === 'on') return '2px solid #4ade80';
                      if (entity.state === 'on') return '2px solid #60a5fa';
                      return '1px solid var(--divider-color)';
                    ]]]
              icon:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_charge_active'];
                      if (act && act.state === 'on') return '#4ade80';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_charge_active'];
                      if (act && act.state === 'on') return '#4ade80';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--primary-text-color)';
                    ]]]
              custom_fields:
                indicators:
                  - padding: "0"
            grid_options:
              columns: 6

          - type: custom:button-card
            entity: binary_sensor.beaglebone_v2h_smart_export_solar_request
            name: Export Excess Solar
            icon: mdi:solar-power-variant
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra_from_ha/smart_export_excess_solar/request
                payload: "[[[ return entity.state === 'on' ? '0' : '1'; ]]]"
            custom_fields:
              indicators: >
                [[[
                  const req = entity.state === 'on';
                  const act = states['binary_sensor.beaglebone_v2h_smart_export_solar_active'];
                  const active = act && act.state === 'on';
                  return `<div style="display:flex;gap:14px;justify-content:center;font-size:0.72em;padding-bottom:6px">
                    <span style="color:${req?'#60a5fa':'#6b7280'}">⬤ Req</span>
                    <span style="color:${active?'#fbbf24':'#6b7280'}">⬤ Active</span>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_solar_active'];
                      if (act && act.state === 'on') return 'rgba(251,191,36,0.2)';
                      if (entity.state === 'on') return 'rgba(96,165,250,0.12)';
                      return 'var(--card-background-color)';
                    ]]]
                - border: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_solar_active'];
                      if (act && act.state === 'on') return '2px solid #fbbf24';
                      if (entity.state === 'on') return '2px solid #60a5fa';
                      return '1px solid var(--divider-color)';
                    ]]]
              icon:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_solar_active'];
                      if (act && act.state === 'on') return '#fbbf24';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_solar_active'];
                      if (act && act.state === 'on') return '#fbbf24';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--primary-text-color)';
                    ]]]
              custom_fields:
                indicators:
                  - padding: "0"
            grid_options:
              columns: 6

          # ── Row 2: four modes (columns 3 each) ───────────────────────────

          - type: custom:button-card
            entity: binary_sensor.beaglebone_v2h_smart_export_request
            name: Smart Export
            icon: mdi:transmission-tower-export
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra_from_ha/smart_export/request
                payload: "[[[ return entity.state === 'on' ? '0' : '1'; ]]]"
            custom_fields:
              indicators: >
                [[[
                  const req = entity.state === 'on';
                  const act = states['binary_sensor.beaglebone_v2h_smart_export_active'];
                  const active = act && act.state === 'on';
                  return `<div style="display:flex;gap:10px;justify-content:center;font-size:0.68em;padding-bottom:6px">
                    <span style="color:${req?'#60a5fa':'#6b7280'}">⬤ Req</span>
                    <span style="color:${active?'#fb923c':'#6b7280'}">⬤ Act</span>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_active'];
                      if (act && act.state === 'on') return 'rgba(251,146,60,0.2)';
                      if (entity.state === 'on') return 'rgba(96,165,250,0.12)';
                      return 'var(--card-background-color)';
                    ]]]
                - border: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_active'];
                      if (act && act.state === 'on') return '2px solid #fb923c';
                      if (entity.state === 'on') return '2px solid #60a5fa';
                      return '1px solid var(--divider-color)';
                    ]]]
              icon:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_active'];
                      if (act && act.state === 'on') return '#fb923c';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_smart_export_active'];
                      if (act && act.state === 'on') return '#fb923c';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--primary-text-color)';
                    ]]]
              custom_fields:
                indicators:
                  - padding: "0"
            grid_options:
              columns: 3

          - type: custom:button-card
            entity: binary_sensor.beaglebone_v2h_ev_drain_protection_request
            name: EV Drain Protect
            icon: mdi:shield-battery-outline
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              service_data:
                topic: indra_from_ha/ev_drain_protection/request
                payload: "[[[ return entity.state === 'on' ? '0' : '1'; ]]]"
            custom_fields:
              indicators: >
                [[[
                  const req = entity.state === 'on';
                  const act = states['binary_sensor.beaglebone_v2h_ev_drain_protection_active'];
                  const active = act && act.state === 'on';
                  return `<div style="display:flex;gap:10px;justify-content:center;font-size:0.68em;padding-bottom:6px">
                    <span style="color:${req?'#60a5fa':'#6b7280'}">⬤ Req</span>
                    <span style="color:${active?'#ef4444':'#6b7280'}">⬤ Act</span>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ev_drain_protection_active'];
                      if (act && act.state === 'on') return 'rgba(239,68,68,0.2)';
                      if (entity.state === 'on') return 'rgba(96,165,250,0.12)';
                      return 'var(--card-background-color)';
                    ]]]
                - border: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ev_drain_protection_active'];
                      if (act && act.state === 'on') return '2px solid #ef4444';
                      if (entity.state === 'on') return '2px solid #60a5fa';
                      return '1px solid var(--divider-color)';
                    ]]]
              icon:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ev_drain_protection_active'];
                      if (act && act.state === 'on') return '#ef4444';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ev_drain_protection_active'];
                      if (act && act.state === 'on') return '#ef4444';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--primary-text-color)';
                    ]]]
              custom_fields:
                indicators:
                  - padding: "0"
            grid_options:
              columns: 3

          - type: custom:button-card
            entity: binary_sensor.beaglebone_v2h_ready_to_drive_request
            name: Ready to Drive
            icon: mdi:car-clock
            show_state: false
            tap_action:
              action: none
            custom_fields:
              indicators: >
                [[[
                  const req = entity.state === 'on';
                  const act = states['binary_sensor.beaglebone_v2h_ready_to_drive_active'];
                  const active = act && act.state === 'on';
                  return `<div style="display:flex;gap:10px;justify-content:center;font-size:0.68em;padding-bottom:6px">
                    <span style="color:${req?'#60a5fa':'#6b7280'}">⬤ Req</span>
                    <span style="color:${active?'#2dd4bf':'#6b7280'}">⬤ Act</span>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ready_to_drive_active'];
                      if (act && act.state === 'on') return 'rgba(45,212,191,0.2)';
                      if (entity.state === 'on') return 'rgba(96,165,250,0.12)';
                      return 'var(--card-background-color)';
                    ]]]
                - border: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ready_to_drive_active'];
                      if (act && act.state === 'on') return '2px solid #2dd4bf';
                      if (entity.state === 'on') return '2px solid #60a5fa';
                      return '1px solid var(--divider-color)';
                    ]]]
              icon:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ready_to_drive_active'];
                      if (act && act.state === 'on') return '#2dd4bf';
                      if (entity.state === 'on') return '#60a5fa';
                      return 'var(--secondary-text-color)';
                    ]]]
              name:
                - color: >
                    [[[
                      const act = states['binary_sensor.beaglebone_v2h_ready_to_drive_active'];
                      if (act && act.state === 'on') return '#2dd4bf';
                      if (entity.state === 'on') return '#60a5fa';
