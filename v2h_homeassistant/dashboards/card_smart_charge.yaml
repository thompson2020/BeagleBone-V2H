type: grid
cards:
  - type: markdown
    content: |
      ## Smart Charge Status

      **Logic — turn ON when all true:**
      - Octopus off-peak dispatch is active
      - Now is before `current_end` of dispatch window
      - Zappi load > 0W  **OR**  within current 30-min block (grace)

      **Turn OFF at the earlier of:**
      - `current_end` timestamp from off-peak sensor
      - End of current 30-min block once Zappi drops to 0W

      Automation publishes to `indra_from_ha/smart_charge/request`

  - type: markdown
    content: |
      Settings → Automations

      **Publish SmartCharge Status (Octopus and MyEnergi) to mbmd MQTT**

  - type: entities
    title: Inputs
    show_header_toggle: false
    entities:
      - entity: binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak
        name: Octopus Off-Peak
      - entity: sensor.myenergi_zappi_22323585_internal_load_ct1
        name: Zappi Load (W)

  - type: entities
    title: Smart Charge Sensors
    show_header_toggle: false
    entities:
      - entity: sensor.smartcharge_status
        name: Smart Charge Status (new)
      - entity: sensor.smartcharge_status_basic
        name: Smart Charge Basic (zappi only)
