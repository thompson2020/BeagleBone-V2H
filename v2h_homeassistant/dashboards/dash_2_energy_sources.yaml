title: Energy
views:
  - title: Electricity Usage
    path: electricity-usage
    icon: mdi:flash
    panel: true
    cards:
      - type: energy-usage-graph
        collection_key: energy_1
        title: Electricity Usage
  - title: Power Sources
    path: power-sources
    icon: mdi:transmission-tower
    panel: true
    cards:
      - type: power-sources-graph
        collection_key: energy_1
        title: Power sources
  - title: Solar Production
    path: solar-production
    icon: mdi:solar-power
    panel: true
    cards:
      - type: energy-solar-graph
        collection_key: energy_1
        title: Solar Production
  - title: Pellet Boiler
    path: pellet-boiler
    icon: mdi:fire
    panel: true
    cards:
      - type: energy-gas-graph
        collection_key: energy_1
        title: Pellet Boiler Consumption
  - title: Sources Table
    path: sources-table
    icon: mdi:table
    type: sections
    sections:
      - type: grid
        columns: 6
        cards:
          - type: energy-date-selection
            collection_key: energy_1
            column_span: 6
          - type: energy-sources-table
            collection_key: energy_1
            title: Energy Sources – Totals
            types:
              - grid
              - solar
              - battery
              - gas
              - overview
            show_only_totals: true
            column_span: 2
      - type: grid
        cards:
          - type: heading
            heading: ' '
            heading_style: title
          - type: energy-sources-table
            collection_key: energy_1
            title: Grid
            types:
              - grid
              - overview
            show_only_totals: false
            column_span: 4
