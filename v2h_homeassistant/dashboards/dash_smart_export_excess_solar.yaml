views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |-
              ## Create current_day and next_day sensors
              Temporary - Once on agile these will come from bottlecapDave

              **Logic:**

              sensor/agile_export.yaml
               - agile_export_current_day_raw
               - agile_export_next_day_raw
                populates from Octopus REST api

              templates/agile_export.yaml
               - agile_export_current_day_rates
               - agile_export_next_day_rates
               - agile_export_current_rate
               task raw data and formats similar to BottlecapDave sensors
          - type: tile
            grid_options:
              columns: full
            entity: sensor.agile_export_current_rate
            vertical: false
            features_position: bottom
          - type: custom:octopus-energy-rates-card
            currentEntity: sensor.agile_export_current_day_rates
            cols: 2
            hour12: false
            showday: true
            showpast: true
            title: Octopus Agile Export(Current Day)
            unitstr: p
            lowlimit: null
            mediumlimit: sensor.agile_import_cheapest_rate
            highlimit: sensor.agile_import_cheapest_rate
            roundUnits: 2
            cheapest: true
            multiplier: 1
            exportrates: true
          - type: custom:octopus-energy-rates-card
            currentEntity: sensor.agile_export_next_day_rates
            cols: 2
            hour12: false
            showday: true
            showpast: true
            title: Octopus Agile Export(Next Day)
            unitstr: p
            lowlimit: null
            mediumlimit: sensor.agile_import_cheapest_rate
            highlimit: sensor.agile_import_cheapest_rate
            roundUnits: 2
            cheapest: true
            multiplier: 1
            exportrates: true
      - type: grid
        cards:
          - type: markdown
            content: >
              ## Smart Export — Excess Solar Status


              **Logic — turn ON when all true:**

              - Current Agile export rate > 0

              - Export rate > cheapest import rate (1× threshold, no multiplier)


              **Cheapest import rate:** minimum rate across all today's import
              slots


              **No multiplier:** direct solar export has no round-trip battery
              loss,

              so any rate above the overnight charge rate is profitable.

              e.g. 6.9p import → threshold 6.9p/kWh to export solar


              Rust acts on this only when solar export mode is enabled.

              Automation publishes to
              `indra_from_ha/smart_export_excess_solar/request`
          - type: entities
            title: Inputs
            show_header_toggle: false
            entities:
              - entity: sensor.agile_export_current_rate
                name: Export Rate (p/kWh)
              - entity: sensor.agile_import_cheapest_rate
                name: Cheapest Import Rate (p/kWh)
          - type: vertical-stack
            cards:
              - type: tile
                entity: sensor.agile_export_current_rate
                name: Current Export Rate
                icon: mdi:solar-power
                state_content: state
                vertical: true
              - type: markdown
                content: >
                  **Rate period ends:** {{
                  state_attr('sensor.agile_export_current_rate', 'rate_end') |
                  as_timestamp | timestamp_custom('%H:%M') }}


                  **Threshold:** {{ states('sensor.agile_import_cheapest_rate')
                  | float(0) | round(1) }}p/kWh
          - type: entities
            title: Smart Export — Excess Solar
            show_header_toggle: false
            entities:
              - entity: sensor.smart_export_excess_solar_status
                name: Excess Solar Export Status
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: grid
            columns: 1
            cards:
              - type: markdown
                content: |
                  ## 🧪 smart_export_excess_solar_status written to mqtt
                  Settings-> Automation 

                  Publish SmartExport(Excess Solar) → mbmd MQTT   
