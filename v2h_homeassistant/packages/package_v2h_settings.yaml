# V2H Operator Settings — HA package
# Defines input helpers and automations for all OperatorSettings fields.
# Include in configuration.yaml:
#   homeassistant:
#     packages:
#       v2h_settings: !include packages/package_v2h_settings.yaml

input_number:
  v2h_soc_min:
    name: V2H SoC Min
    min: 10
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-low
  v2h_soc_max:
    name: V2H SoC Max
    min: 10
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-high
  v2h_soc_max_boost:
    name: V2H SoC Max (Boost)
    min: 10
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-charging
  v2h_max_amps:
    name: V2H Max Amps
    min: 1
    max: 16
    step: 1
    unit_of_measurement: "A"
    icon: mdi:current-ac
  v2h_ready_to_drive_soc:
    name: RTD SoC Target
    min: 10
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:steering
  v2h_smart_export_limit_w:
    name: Smart Export Limit
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:transmission-tower-export
  v2h_smart_export_soc_min:
    name: Smart Export SoC Min
    min: 10
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-down
  v2h_charge_soc_limit:
    name: Charge SoC Limit
    min: 10
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-charging-outline
  v2h_charge_amps:
    name: Charge Amps
    min: 1
    max: 16
    step: 1
    unit_of_measurement: "A"
    icon: mdi:current-ac

input_datetime:
  v2h_ready_to_drive_start_time:
    name: RTD Start Time
    has_time: true
    has_date: false
  v2h_ready_to_drive_end_time:
    name: RTD End Time
    has_time: true
    has_date: false
  v2h_off_peak_start:
    name: Off-Peak Start
    has_time: true
    has_date: false
  v2h_off_peak_end:
    name: Off-Peak End
    has_time: true
    has_date: false

input_boolean:
  v2h_self_use:
    name: V2H Self Use
    icon: mdi:home-lightning-bolt
  v2h_export_excess_solar:
    name: Export Excess Solar
    icon: mdi:solar-power-variant
  v2h_ev_drain_protection:
    name: EV Drain Protection
    icon: mdi:shield-battery-outline
  v2h_ready_to_drive:
    name: Ready to Drive
    icon: mdi:steering
  v2h_off_peak_charging:
    name: Off-Peak Charging
    icon: mdi:weather-night
  v2h_smart_charge:
    name: Smart Charge
    icon: mdi:battery-charging-outline
  v2h_smart_export:
    name: Smart Export
    icon: mdi:transmission-tower-export
  v2h_smart_export_excess_solar:
    name: Smart Export Excess Solar
    icon: mdi:solar-power-variant
  v2h_charge_eco:
    name: Charge Eco Mode
    icon: mdi:leaf
  v2h_rtd_day_mon:
    name: RTD Monday
    icon: mdi:calendar
  v2h_rtd_day_tue:
    name: RTD Tuesday
    icon: mdi:calendar
  v2h_rtd_day_wed:
    name: RTD Wednesday
    icon: mdi:calendar
  v2h_rtd_day_thu:
    name: RTD Thursday
    icon: mdi:calendar
  v2h_rtd_day_fri:
    name: RTD Friday
    icon: mdi:calendar
  v2h_rtd_day_sat:
    name: RTD Saturday
    icon: mdi:calendar
  v2h_rtd_day_sun:
    name: RTD Sunday
    icon: mdi:calendar

automation:
  - alias: "V2H Set v2h_soc_min"
    trigger:
      - platform: state
        entity_id: input_number.v2h_soc_min
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"v2h_soc_min":{{ states('input_number.v2h_soc_min') | int }}}}}

  - alias: "V2H Set v2h_soc_max"
    trigger:
      - platform: state
        entity_id: input_number.v2h_soc_max
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"v2h_soc_max":{{ states('input_number.v2h_soc_max') | int }}}}}

  - alias: "V2H Set v2h_soc_max_boost"
    trigger:
      - platform: state
        entity_id: input_number.v2h_soc_max_boost
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"v2h_soc_max_boost":{{ states('input_number.v2h_soc_max_boost') | int }}}}}

  - alias: "V2H Set v2h_max_amps"
    trigger:
      - platform: state
        entity_id: input_number.v2h_max_amps
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"v2h_max_amps":{{ states('input_number.v2h_max_amps') | int }}}}}

  - alias: "V2H Set ready_to_drive_soc"
    trigger:
      - platform: state
        entity_id: input_number.v2h_ready_to_drive_soc
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"ready_to_drive_soc":{{ states('input_number.v2h_ready_to_drive_soc') | int }}}}}

  - alias: "V2H Set smart_export_limit_w"
    trigger:
      - platform: state
        entity_id: input_number.v2h_smart_export_limit_w
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"smart_export_limit_w":{{ states('input_number.v2h_smart_export_limit_w') | int }}}}}

  - alias: "V2H Set smart_export_soc_min"
    trigger:
      - platform: state
        entity_id: input_number.v2h_smart_export_soc_min
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"smart_export_soc_min":{{ states('input_number.v2h_smart_export_soc_min') | int }}}}}

  - alias: "V2H Set charge_soc_limit"
    trigger:
      - platform: state
        entity_id: input_number.v2h_charge_soc_limit
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"charge_soc_limit":{{ states('input_number.v2h_charge_soc_limit') | int }}}}}

  - alias: "V2H Set charge_amps"
    trigger:
      - platform: state
        entity_id: input_number.v2h_charge_amps
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"charge_amps":{{ states('input_number.v2h_charge_amps') | int }}}}}

  - alias: "V2H Set ready_to_drive_start_time"
    trigger:
      - platform: state
        entity_id: input_datetime.v2h_ready_to_drive_start_time
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"ready_to_drive_start_time":"{{ states('input_datetime.v2h_ready_to_drive_start_time')[:5] }}"}}}

  - alias: "V2H Set ready_to_drive_end_time"
    trigger:
      - platform: state
        entity_id: input_datetime.v2h_ready_to_drive_end_time
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"ready_to_drive_end_time":"{{ states('input_datetime.v2h_ready_to_drive_end_time')[:5] }}"}}}

  - alias: "V2H Set off_peak_start"
    trigger:
      - platform: state
        entity_id: input_datetime.v2h_off_peak_start
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"off_peak_start":"{{ states('input_datetime.v2h_off_peak_start')[:5] }}"}}}

  - alias: "V2H Set off_peak_end"
    trigger:
      - platform: state
        entity_id: input_datetime.v2h_off_peak_end
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"off_peak_end":"{{ states('input_datetime.v2h_off_peak_end')[:5] }}"}}}

  - alias: "V2H Set self_use"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_self_use
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"self_use":{{ (states('input_boolean.v2h_self_use') == 'on') | lower }}}}}

  - alias: "V2H Set export_excess_solar"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_export_excess_solar
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"export_excess_solar":{{ (states('input_boolean.v2h_export_excess_solar') == 'on') | lower }}}}}

  - alias: "V2H Set ev_drain_protection"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_ev_drain_protection
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"ev_drain_protection":{{ (states('input_boolean.v2h_ev_drain_protection') == 'on') | lower }}}}}

  - alias: "V2H Set ready_to_drive"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_ready_to_drive
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"ready_to_drive":{{ (states('input_boolean.v2h_ready_to_drive') == 'on') | lower }}}}}

  - alias: "V2H Set off_peak_charging"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_off_peak_charging
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"off_peak_charging":{{ (states('input_boolean.v2h_off_peak_charging') == 'on') | lower }}}}}

  - alias: "V2H Set smart_charge"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_smart_charge
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"smart_charge":{{ (states('input_boolean.v2h_smart_charge') == 'on') | lower }}}}}

  - alias: "V2H Set smart_export"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_smart_export
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"smart_export":{{ (states('input_boolean.v2h_smart_export') == 'on') | lower }}}}}

  - alias: "V2H Set smart_export_excess_solar"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_smart_export_excess_solar
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"smart_export_excess_solar":{{ (states('input_boolean.v2h_smart_export_excess_solar') == 'on') | lower }}}}}

  - alias: "V2H Set charge_eco"
    trigger:
      - platform: state
        entity_id: input_boolean.v2h_charge_eco
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"charge_eco":{{ (states('input_boolean.v2h_charge_eco') == 'on') | lower }}}}}

  - alias: "V2H Set ready_to_drive_days"
    trigger:
      - platform: state
        entity_id:
          - input_boolean.v2h_rtd_day_mon
          - input_boolean.v2h_rtd_day_tue
          - input_boolean.v2h_rtd_day_wed
          - input_boolean.v2h_rtd_day_thu
          - input_boolean.v2h_rtd_day_fri
          - input_boolean.v2h_rtd_day_sat
          - input_boolean.v2h_rtd_day_sun
    action:
      - service: mqtt.publish
        data:
          topic: v2h/command
          payload: >-
            {"cmd":{"SetSetting":{"ready_to_drive_days":[{{ (states('input_boolean.v2h_rtd_day_mon')=='on')|lower }},{{ (states('input_boolean.v2h_rtd_day_tue')=='on')|lower }},{{ (states('input_boolean.v2h_rtd_day_wed')=='on')|lower }},{{ (states('input_boolean.v2h_rtd_day_thu')=='on')|lower }},{{ (states('input_boolean.v2h_rtd_day_fri')=='on')|lower }},{{ (states('input_boolean.v2h_rtd_day_sat')=='on')|lower }},{{ (states('input_boolean.v2h_rtd_day_sun')=='on')|lower }}]}}}
