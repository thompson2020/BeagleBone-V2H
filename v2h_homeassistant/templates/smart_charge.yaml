- sensor:
    - name: "octopus_energy_electricity_25j0059396_1100003642142_off_peak_current_end"
      state: >
        {{ state_attr('binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak', 'current_end') | default('none', true) }}

- trigger:
    - platform: state
      entity_id: sensor.myenergi_zappi_22323585_internal_load_ct1
    - platform: state
      entity_id: binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak
    - platform: time_pattern
      minutes: "/1"
  sensor:
    - name: "smartcharge_status_basic"
      state: >
        {{ 1 if (states('sensor.myenergi_zappi_22323585_internal_load_ct1') | float(0) > 0) else 0 }}

    - name: "smartcharge_status"
      unit_of_measurement: ""
      state: >
        {% set off_peak = is_state('binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak', 'on') %}
        {% if not off_peak %}
          {{ 0 }}
        {% else %}
          {% set zappi_w = states('sensor.myenergi_zappi_22323585_internal_load_ct1') | float(0) %}
          {% set now_ts = now().timestamp() %}
          {% set current_end_ts = as_timestamp(
              state_attr('binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak', 'current_end')
              | default('1970-01-01T00:00:00+00:00')
            ) %}
          {% if now_ts >= current_end_ts %}
            {{ 0 }}
          {% elif zappi_w > 1000 %}
            {{ 1 }}
          {% else %}
            {# Grace period: stay 1 until end of the 30-min slot in which charging stopped.
               Use Zappi sensor's last_changed — HA restores this correctly after restart,
               unlike trigger-based template sensors which reset last_changed to boot time. #}
            {% set zappi_entity = states.sensor.myenergi_zappi_22323585_internal_load_ct1 %}
            {% set stop_ts   = as_timestamp(zappi_entity.last_changed) if zappi_entity else 0 %}
            {% set now_slot  = (now().hour * 60 + now().minute) // 30 %}
            {% set stop_hour = (stop_ts | timestamp_custom('%H', true)) | int %}
            {% set stop_min  = (stop_ts | timestamp_custom('%M', true)) | int %}
            {% set stop_slot = (stop_hour * 60 + stop_min) // 30 %}
            {{ 1 if now_slot == stop_slot else 0 }}
          {% endif %}
        {% endif %}

    - name: "smartcharge_status_end_time"
      device_class: timestamp
      state: >
        {% set off_peak = is_state('binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak', 'on') %}
        {% if not off_peak %}
          {{ 'unavailable' }}
        {% else %}
          {% set zappi_w = states('sensor.myenergi_zappi_22323585_internal_load_ct1') | float(0) %}
          {% set current_end = state_attr('binary_sensor.octopus_energy_electricity_25j0059396_1100003642142_off_peak', 'current_end') | default(none) %}
          {% set now_ts = now().timestamp() %}
          {% set current_end_ts = as_timestamp(current_end | default('1970-01-01T00:00:00+00:00')) %}
          {% if now_ts >= current_end_ts %}
            {{ 'unavailable' }}
          {% elif zappi_w > 1000 %}
            {# Actively charging — end time is when the off-peak slot expires #}
            {{ current_end }}
          {% else %}
            {# Grace period — end time is the boundary of the current 30-min slot #}
            {% set zappi_entity = states.sensor.myenergi_zappi_22323585_internal_load_ct1 %}
            {% set stop_ts   = as_timestamp(zappi_entity.last_changed) if zappi_entity else 0 %}
            {% set now_slot  = (now().hour * 60 + now().minute) // 30 %}
            {% set stop_hour = (stop_ts | timestamp_custom('%H', true)) | int %}
            {% set stop_min  = (stop_ts | timestamp_custom('%M', true)) | int %}
            {% set stop_slot = (stop_hour * 60 + stop_min) // 30 %}
            {% if now_slot == stop_slot %}
              {% set slot_end_ts = ((now_ts | int // 1800) + 1) * 1800 %}
              {{ slot_end_ts | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}
            {% else %}
              {{ 'unavailable' }}
            {% endif %}
          {% endif %}
        {% endif %}
